<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">

```
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
    body {

        padding: 30px;

        padding: 30px;

        color: #2c3e50;

<body>

<div class="container">

```
<div class="form-container" id="meetingForm">

    <h1 class="mb-4">One-on-One Meeting</h1>

    <div class="row mb-3">
        <div class="col-md-4">
            <label class="form-label">Meeting Date</label>
            <input type="date" class="form-control autosave" id="meetingDate">
        </div>
    </div>

    <h2 class="mt-4">Planning for Your One-on-One Meeting</h2>

    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Supervisor Name</label>
            <input type="text" class="form-control autosave" id="supervisor">
        </div>

        <div class="col-md-6">
            <label class="form-label">Staff Name</label>
            <input type="text" class="form-control autosave" id="staff">
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Objective of the Conversation</label>
        <textarea class="form-control autosave" id="objective"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Clarify the Situation</label>
        <textarea class="form-control autosave" id="clarify"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Options</label>
        <textarea class="form-control autosave" id="options"></textarea>
    </div>

    <h2 class="mt-5">One-on-One Meeting Critique</h2>

    <div class="mb-3">
        <label class="form-label">What Worked?</label>
        <textarea class="form-control autosave" id="worked"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">What Could Be Improved?</label>
        <textarea class="form-control autosave" id="improved"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Results & Ideas for Next One-on-One Meeting</label>
        <textarea class="form-control autosave" id="results"></textarea>
    </div>

</div>

<div class="mt-4 no-print">
    <div class="btn-toolbar">
        <button class="btn btn-primary" onclick="downloadPDF()">
            Export PDF
        </button>

        <button class="btn btn-secondary" onclick="clearForm()">
            Clear Form
        </button>
    </div>

    <div id="savedMessage" class="saved-message mt-2">
        Changes saved automatically.
    </div>
</div>
```

</div>

<script>

const fields = document.querySelectorAll('.autosave');

function saveData() {
    const data = {};

    fields.forEach(field => {
        data[field.id] = field.value;
    });

    localStorage.setItem('oneOnOneMeeting', JSON.stringify(data));

    const msg = document.getElementById('savedMessage');
    msg.style.display = 'block';

    setTimeout(() => {
        msg.style.display = 'none';
    }, 1500);
}

function loadData() {

    const data = JSON.parse(
        localStorage.getItem('oneOnOneMeeting')
    );

    if (!data) return;

    fields.forEach(field => {
        if (data[field.id]) {
            field.value = data[field.id];
        }
    });
}

function clearForm() {

    if (!confirm("Clear all saved data?")) return;

    localStorage.removeItem('oneOnOneMeeting');

    fields.forEach(field => {
        field.value = '';
    });
}

function downloadPDF() {

    const element =
        document.getElementById('meetingForm');

    const options = {
        margin: .5,
        filename: 'One-On-One-Meeting.pdf',
        image: { type: 'jpeg', quality: 1 },
        html2canvas: { scale: 2 },
        jsPDF: {
            unit: 'in',
            format: 'letter',
            orientation: 'portrait'
        }
    };

    html2pdf().set(options).from(element).save();
}

fields.forEach(field => {
    field.addEventListener('input', saveData);
});

loadData();

</script>

</body>
</html>
