<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>One-on-One Meeting Template</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>

body {
    background: #f5f7fa;
    padding: 30px;
    font-family: Arial, Helvetica, sans-serif;
}

.form-container {
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 2px 10px rgba(0,0,0,.1);
}

h1 {
    color: #2c3e50;
    margin-bottom: 25px;
}

h2 {
    color: #2c3e50;
    margin-top: 35px;
    margin-bottom: 20px;
    border-bottom: 2px solid #e9ecef;
    padding-bottom: 8px;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

.saved-message {
    display: none;
    color: #198754;
    margin-top: 10px;
    font-size: .9rem;
}

.btn-toolbar {
    gap: 10px;
}

#meetingForm {
    width: 100%;
    overflow: visible;
}

/* PRINT MODE */
@media print {

    body {
        background: white;
        padding: 0;
        margin: 0;
    }

    .form-container {
        box-shadow: none;
        border: none;
        padding: 0;
    }

    .no-print {
        display: none !important;
    }
}

</style>

</head>

<body>

<div class="container">

<div class="form-container" id="meetingForm">

<h1>One-on-One Meeting</h1>

<div class="row mb-4">
    <div class="col-md-4">
        <label class="form-label fw-bold">Meeting Date</label>
        <input type="date" class="form-control autosave" id="meetingDate">
    </div>
</div>

<h2>Planning for Your One-on-One Meeting</h2>

<div class="row mb-4">

    <div class="col-md-6">
        <label class="form-label fw-bold">Supervisor Name</label>
        <input type="text" class="form-control autosave" id="supervisor">
    </div>

    <div class="col-md-6">
        <label class="form-label fw-bold">Staff Name</label>
        <input type="text" class="form-control autosave" id="staff">
    </div>

</div>

<div class="mb-4">
    <label class="form-label fw-bold">Objective of the Conversation</label>
    <textarea class="form-control autosave" id="objective"></textarea>
</div>

<div class="mb-4">
    <label class="form-label fw-bold">Clarify the Situation</label>
    <textarea class="form-control autosave" id="clarify"></textarea>
</div>

<div class="mb-4">
    <label class="form-label fw-bold">Options</label>
    <textarea class="form-control autosave" id="options"></textarea>
</div>

<h2>One-on-One Meeting Critique</h2>

<div class="mb-4">
    <label class="form-label fw-bold">What Worked?</label>
    <textarea class="form-control autosave" id="worked"></textarea>
</div>

<div class="mb-4">
    <label class="form-label fw-bold">What Could Be Improved?</label>
    <textarea class="form-control autosave" id="improved"></textarea>
</div>

<div class="mb-4">
    <label class="form-label fw-bold">Results & Ideas for Next One-on-One Meeting</label>
    <textarea class="form-control autosave" id="results"></textarea>
</div>

</div>

<!-- BUTTONS -->
<div class="mt-4 no-print">

    <div class="btn-toolbar">

        <button class="btn btn-primary" onclick="downloadPDF()">
            Export PDF
        </button>

        <button class="btn btn-secondary" onclick="clearForm()">
            Clear Form
        </button>

    </div>

    <div id="savedMessage" class="saved-message">
        Changes saved automatically.
    </div>

</div>

</div>

<!-- SCRIPT -->
<script>

const fields = document.querySelectorAll('.autosave');

/* SAVE */
function saveData() {
    const data = {};

    fields.forEach(field => {
        data[field.id] = field.value;
    });

    localStorage.setItem(
        'oneOnOneMeeting',
        JSON.stringify(data)
    );

    const msg = document.getElementById('savedMessage');

    if (msg) {
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 1200);
    }
}

/* LOAD */
function loadData() {

    const data = JSON.parse(
        localStorage.getItem('oneOnOneMeeting')
    );

    if (!data) return;

    fields.forEach(field => {
        if (data[field.id] !== undefined) {
            field.value = data[field.id];
        }
    });
}

/* CLEAR */
function clearForm() {

    if (!confirm('Clear all saved information?')) return;

    localStorage.removeItem('oneOnOneMeeting');

    fields.forEach(field => field.value = '');

    saveData();
}

/* PDF EXPORT */
function downloadPDF() {

    const element = document.getElementById('meetingForm');

    const options = {
        margin: 0.25,
        filename: 'One-On-One-Meeting.pdf',

        image: {
            type: 'jpeg',
            quality: 1
        },

        html2canvas: {
            scale: 2,
            scrollY: 0,
            useCORS: true
        },

        jsPDF: {
            unit: 'in',
            format: 'letter',
            orientation: 'portrait'
        }
    };

    html2pdf()
        .set(options)
        .from(element)
        .save();
}

/* AUTO SAVE LISTENERS */
fields.forEach(field => {
    field.addEventListener('input', saveData);
});

/* INIT LOAD */
window.addEventListener('DOMContentLoaded', loadData);

</script>

</body>
</html>
